<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slsk-auto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #232736;
      --border:   #2e3347;
      --accent:   #7c6ff7;
      --text:     #e2e4f0;
      --muted:    #6b7094;
      --green:    #4ade80;
      --amber:    #fbbf24;
      --red:      #f87171;
      --blue:     #60a5fa;
      --mono:     'SF Mono','Cascadia Code',Consolas,monospace;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 15px; letter-spacing: -.3px; color: var(--accent); }
    .spacer { flex: 1; }
    .badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
      padding: 4px 10px; border-radius: 20px; background: var(--surface2);
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .badge.on .dot { background: var(--green); }
    .badge.on { color: var(--text); }
    button {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 6px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    #sync-btn { background: var(--accent); color: #fff; }
    #sync-btn:hover { background: #6558e0; }
    #sync-btn:disabled { opacity: .4; pointer-events: none; }
    #stop-btn { background: var(--surface2); color: var(--red); border: 1px solid var(--border); }
    #stop-btn:hover { background: rgba(248,113,113,.12); }
    #stop-btn:disabled { opacity: .3; pointer-events: none; }

    /* Panels */
    .panels { display: grid; grid-template-columns: 300px 1fr; flex: 1; overflow: hidden; }
    .panel { display: flex; flex-direction: column; overflow: hidden; }
    .panel:first-child { border-right: 1px solid var(--border); }
    .panel-title {
      padding: 10px 14px;
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title .spacer { flex: 1; }
    .refresh-btn {
      background: none; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 1px 4px; border-radius: 4px; line-height: 1;
    }
    .refresh-btn:hover { color: var(--text); background: var(--surface2); }

    /* Queue list */
    #queue-list { flex: 1; overflow-y: auto; }
    #queue-list::-webkit-scrollbar { width: 4px; }
    #queue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .group-header {
      padding: 8px 14px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; gap: 6px;
    }
    .group-header .count {
      background: var(--surface2); padding: 1px 6px; border-radius: 8px;
      font-size: 10px; color: var(--muted); font-weight: 600;
    }

    .q-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; transition: background .1s; cursor: default;
    }
    .q-item:hover { background: var(--surface2); }
    .q-status { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; }
    .q-label { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-meta { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .q-del {
      opacity: 0; background: none; border: none; color: var(--muted);
      font-size: 15px; line-height: 1; padding: 1px 5px; border-radius: 4px; cursor: pointer;
    }
    .q-item:hover .q-del { opacity: 1; }
    .q-del:hover { background: rgba(248,113,113,.15); color: var(--red); }

    /* Status dot colors */
    .dot-progress { background: var(--blue); box-shadow: 0 0 0 2px rgba(96,165,250,.25); animation: pulse 1.5s infinite; }
    .dot-pending  { background: var(--muted); }
    .dot-done     { background: var(--green); }
    .dot-unverified { background: var(--amber); }
    .dot-failed   { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .q-empty { padding: 14px; color: var(--muted); font-style: italic; font-size: 13px; }

    /* Add form */
    .add-form {
      display: flex; gap: 6px; padding: 10px;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .add-form input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form input::placeholder { color: var(--muted); }
    .add-form button { background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 6px 12px; }
    .add-form button:hover { background: rgba(124,111,247,.15); border-color: var(--accent); }

    /* Log */
    #log {
      flex: 1; overflow-y: auto; padding: 10px 14px;
      font-family: var(--mono); font-size: 12px; line-height: 1.8;
    }
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .ll { display: block; }
    .ll.hdr  { color: var(--accent); font-weight: 700; margin-top: 8px; }
    .ll.sec  { color: var(--text); font-weight: 600; }
    .ll.ok   { color: var(--green); }
    .ll.warn { color: var(--amber); }
    .ll.err  { color: var(--red); }
    .ll.mb   { color: var(--muted); font-style: italic; }
    .ll.done { color: var(--green); font-weight: 700; }
    .log-empty { color: var(--muted); font-style: italic; font-size: 13px; font-family: inherit; }

    /* Library */
    .library {
      flex-shrink: 0; height: 195px;
      display: flex; flex-direction: column;
      border-top: 1px solid var(--border); overflow: hidden;
    }
    .lib-header {
      display: flex; align-items: center; gap: 8px; padding: 9px 14px;
      font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); flex-shrink: 0;
    }
    .lib-tag {
      background: var(--surface2); color: var(--text);
      font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none;
      padding: 2px 8px; border-radius: 10px;
    }
    .lib-count { font-weight: 400; text-transform: none; letter-spacing: 0; }
    #lib-grid {
      display: flex; gap: 8px; padding: 0 14px 12px;
      overflow-x: auto; overflow-y: hidden; flex: 1;
    }
    #lib-grid::-webkit-scrollbar { height: 4px; }
    #lib-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .alb {
      flex-shrink: 0; width: 120px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; transition: border-color .15s;
    }
    .alb:hover { border-color: var(--accent); }
    .alb-artist { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
    .alb-name   { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
    .alb-count  { font-size: 10px; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">slsk-auto</div>
  <div id="device-badge" class="badge"><div class="dot"></div><span>checking…</span></div>
  <div class="spacer"></div>
  <button id="sync-btn" onclick="startSync()">▶ Sync</button>
  <button id="stop-btn" onclick="stopSync()" disabled>■ Stop</button>
</header>

<div class="panels">
  <div class="panel">
    <div class="panel-title">
      Queue
      <div class="spacer"></div>
      <button class="refresh-btn" onclick="loadQueue()" title="Refresh">↻</button>
    </div>
    <div id="queue-list"></div>
    <form class="add-form" onsubmit="addAlbum(event)">
      <input id="add-input" type="text" placeholder="Artist - Album" autocomplete="off">
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="panel">
    <div class="panel-title">Activity</div>
    <div id="log"><span class="log-empty">Run a sync to see activity.</span></div>
  </div>
</div>

<div class="library">
  <div class="lib-header">
    Library
    <span id="lib-source" class="lib-tag"></span>
    <span id="lib-count" class="lib-count"></span>
    <div class="spacer"></div>
    <button class="refresh-btn" onclick="loadLibrary()" title="Refresh library">↻</button>
  </div>
  <div id="lib-grid"></div>
</div>

<script>
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let es = null;

  async function api(path, opts={}) {
    return fetch(path, { headers: {'Content-Type':'application/json'}, ...opts }).then(r => r.json());
  }

  // ── Status ────────────────────────────────────
  async function pollStatus() {
    const s = await api('/api/status');
    const badge = document.getElementById('device-badge');
    if (s.device_mounted) {
      badge.className = 'badge on';
      badge.innerHTML = `<div class="dot"></div><span>${esc(s.device_name)}</span>`;
    } else {
      badge.className = 'badge';
      badge.innerHTML = `<div class="dot"></div><span>device not mounted</span>`;
    }
    setRunning(s.sync_running);
    if (s.sync_running) loadQueue();
  }

  function setRunning(on) {
    document.getElementById('sync-btn').disabled = on;
    document.getElementById('stop-btn').disabled = !on;
  }

  // ── Queue ─────────────────────────────────────
  async function loadQueue() {
    const data = await api('/api/watchlist');
    const el = document.getElementById('queue-list');
    el.innerHTML = '';

    const groups = [
      { key: 'in_progress', label: 'Downloading',  dotClass: 'dot-progress',   showMeta: true },
      { key: 'not_started', label: 'Pending',       dotClass: 'dot-pending',    showMeta: false },
      { key: 'completed',   label: 'Downloaded',    dotClass: 'dot-unverified', showMeta: true },
      { key: 'failed',      label: 'Failed',        dotClass: 'dot-failed',     showMeta: false },
    ];

    let any = false;
    for (const g of groups) {
      const items = data[g.key] || [];
      if (!items.length) continue;
      any = true;
      const hdr = document.createElement('div');
      hdr.className = 'group-header';
      hdr.innerHTML = `${g.label} <span class="count">${items.length}</span>`;
      el.appendChild(hdr);
      items.forEach(item => el.appendChild(makeQItem(item, g.dotClass, g.showMeta)));
    }
    if (!any) el.innerHTML = '<div class="q-empty">Nothing queued.</div>';
  }

  function makeQItem(item, dotClass, showMeta) {
    const div = document.createElement('div');
    div.className = 'q-item';
    const dot = document.createElement('span');
    dot.className = `q-status ${dotClass}`;
    const lbl = document.createElement('span');
    lbl.className = 'q-label';
    lbl.textContent = item.entry;
    lbl.title = item.entry;
    div.appendChild(dot);
    div.appendChild(lbl);
    if (showMeta && item.tracks > 0) {
      const meta = document.createElement('span');
      meta.className = 'q-meta';
      meta.textContent = `${item.tracks} trk`;
      div.appendChild(meta);
    }
    if (item.status !== 'in_progress') {
      const btn = document.createElement('button');
      btn.className = 'q-del'; btn.textContent = '×'; btn.title = 'Remove';
      btn.dataset.entry = item.entry;
      btn.addEventListener('click', function() { deleteEntry(this.dataset.entry, div); });
      div.appendChild(btn);
    }
    return div;
  }

  async function addAlbum(e) {
    e.preventDefault();
    const input = document.getElementById('add-input');
    const entry = input.value.trim();
    if (!entry) return;
    const r = await api('/api/watchlist', { method:'POST', body: JSON.stringify({entry}) });
    if (r.duplicate) { input.style.borderColor = 'var(--amber)'; setTimeout(() => input.style.borderColor='', 1200); return; }
    input.value = '';
    loadQueue();
  }

  async function deleteEntry(entry, row) {
    row.style.opacity = '.4';
    await api('/api/watchlist/delete', { method:'POST', body: JSON.stringify({entry}) });
    loadQueue();
  }

  // ── Library ───────────────────────────────────
  async function loadLibrary() {
    const { albums, source } = await api('/api/library');
    document.getElementById('lib-source').textContent = source === 'device' ? 'Device' : 'Staging';
    document.getElementById('lib-count').textContent = `${albums.length} album${albums.length !== 1 ? 's' : ''}`;
    const grid = document.getElementById('lib-grid');
    grid.innerHTML = '';
    albums.forEach(a => {
      const card = document.createElement('div');
      card.className = 'alb'; card.title = a.name;
      card.innerHTML = `<div class="alb-artist">${esc(a.artist||'—')}</div>
        <div class="alb-name">${esc(a.album)}</div>
        <div class="alb-count">${a.tracks} track${a.tracks!==1?'s':''}</div>`;
      grid.appendChild(card);
    });
  }

  // ── Sync ──────────────────────────────────────
  async function startSync() {
    const r = await api('/api/sync', { method:'POST' });
    if (r.error) { alert(r.error); return; }
    setRunning(true);
    document.getElementById('log').innerHTML = '';
    connectStream();
  }

  async function stopSync() {
    await api('/api/sync/stop', { method:'POST' });
  }

  function connectStream() {
    if (es) es.close();
    es = new EventSource('/stream');
    es.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.t === 'log') appendLog(msg.text);
      if (msg.t === 'done') { setRunning(false); loadQueue(); loadLibrary(); es.close(); es = null; }
    };
    es.onerror = () => { setRunning(false); es.close(); es = null; };
  }

  function classifyLine(t) {
    if (t.startsWith('---'))                       return 'hdr';
    if (t.startsWith('==>') && /[Dd]one/.test(t)) return 'done';
    if (t.startsWith('==>'))                       return 'sec';
    if (/\bOK\b|close enough|verified/.test(t))   return 'ok';
    if (/MISMATCH|WARNING|FAILED|failed/i.test(t)) return 'warn';
    if (/error/i.test(t))                          return 'err';
    if (/MusicBrainz:/.test(t))                    return 'mb';
    return '';
  }

  function appendLog(text) {
    const log = document.getElementById('log');
    const empty = log.querySelector('.log-empty');
    if (empty) empty.remove();
    const span = document.createElement('span');
    span.className = 'll ' + classifyLine(text);
    span.textContent = text;
    log.appendChild(span);
    log.scrollTop = log.scrollHeight;
  }

  // ── Init ──────────────────────────────────────
  pollStatus();
  loadQueue();
  loadLibrary();
  setInterval(async () => {
    await pollStatus();
    const running = document.getElementById('sync-btn').disabled;
    if (running) { loadQueue(); loadLibrary(); }
  }, 5000);
  setInterval(loadLibrary, 30000);
</script>
</body>
</html>
