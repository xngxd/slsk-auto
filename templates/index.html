<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>slsk-auto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #e8e4da;
      --card:   #f5f2eb;
      --border: #d4d0c6;
      --text:   #0e0d0b;
      --muted:  #a09c92;
      --green:  #1e6b3a;
      --amber:  #8a5210;
      --red:    #a82020;
      --blue:   #1c3d8a;
      --mono:   'SF Mono','Cascadia Code',Consolas,monospace;
    }
    body {
      background: var(--bg);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px; letter-spacing: -0.01em;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ── Score texture ── */
    .bg-score {
      position: fixed; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 120%; pointer-events: none; z-index: 0;
      opacity: 0.07; mix-blend-mode: multiply;
      user-select: none; -webkit-user-select: none;
    }

    /* ── Shell ── */
    .shell {
      position: relative; z-index: 1;
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      padding: 16px 16px 0;
    }
    .card {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      background: var(--card);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -2px 40px rgba(0,0,0,0.08);
    }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 22px 10px;
      flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 12px; letter-spacing: -0.02em; color: var(--text); }
    .device-label { font-size: 11px; color: var(--muted); }
    .device-label.on { color: var(--text); }
    .hdr-spacer { flex: 1; }
    .hdr-btns { display: flex; gap: 6px; }
    .hdr-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
      padding: 4px 10px; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .hdr-btn:hover { color: var(--text); border-color: #999; }
    .hdr-btn.primary { color: var(--text); border-color: #aaa; }
    .hdr-btn.danger  { color: var(--red);  border-color: var(--red); }
    .hdr-btn:disabled { opacity: .25; pointer-events: none; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-shrink: 0; padding: 0 22px;
    }
    .tab {
      padding: 8px 0; margin-right: 22px;
      font-size: 10px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 1.5px solid transparent;
      cursor: pointer; transition: color .15s, border-color .15s;
      user-select: none; position: relative;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--text); }
    .tab:hover:not(.active) { color: var(--text); }
    .tab-dot {
      display: none; width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); position: absolute; top: 7px; right: -7px;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .tab-dot.visible { display: inline-block; }

    /* ── Tab pages ── */
    .page { flex: 1; display: none; overflow: hidden; }
    .page.active { display: flex; flex-direction: column; }

    /* ── Animations ── */
    @keyframes hero-glow {
      0%, 100% { box-shadow: inset 0 0 0 1px rgba(14,13,11,0.08), inset 0 0 40px rgba(14,13,11,0.02); }
      50%       { box-shadow: inset 0 0 0 1px rgba(14,13,11,0.2),  inset 0 0 40px rgba(14,13,11,0.06); }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.55); }
    }

    /* ── Hero ── */
    .active-hero {
      padding: 24px 22px 20px;
      flex-shrink: 0; cursor: default;
      transition: background .3s; user-select: none;
    }
    .active-hero.live {
      animation: hero-glow 2s ease-in-out infinite;
      cursor: pointer;
    }
    .hero-header { display: flex; align-items: center; justify-content: space-between; }
    .hero-label {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; gap: 7px;
    }
    .hero-live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text);
      animation: dot-pulse 1.4s ease-in-out infinite; flex-shrink: 0;
    }
    .hero-chevron { font-size: 10px; color: var(--muted); transition: transform .2s; }
    .hero-chevron.open { transform: rotate(180deg); }
    .hero-title {
      font-size: 30px; font-weight: 700; letter-spacing: -0.035em;
      color: var(--text); line-height: 1.08; margin-top: 10px;
      word-break: break-word;
    }
    .hero-subtitle { font-size: 10px; color: var(--muted); margin-top: 6px; letter-spacing: 0.03em; }
    .hero-empty { color: var(--muted); font-size: 12px; margin-top: 10px; font-style: italic; }
    .hero-expanded { padding: 8px 0 2px; }
    .hero-exp-item {
      font-size: 11px; color: var(--muted); padding: 2px 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hero-exp-item.primary { color: var(--text); font-weight: 600; }

    /* ── Queue list ── */
    #queue-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    #queue-list::-webkit-scrollbar { width: 0; }

    .group-sep {
      padding: 16px 22px 4px;
    }
    .group-sep-line { display: none; }
    .group-sep-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .q-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 22px; transition: background .1s; cursor: default;
    }
    .q-item:hover { background: rgba(0,0,0,0.02); }
    .q-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .q-label {
      font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text);
    }
    .q-label.muted   { color: var(--muted); }
    .q-label.failed  { color: var(--red); }
    .q-label.success { color: var(--green); }
    .q-reason {
      font-size: 10px; color: var(--red); opacity: 0.65;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--mono);
    }
    .q-meta { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .q-del {
      opacity: 0; background: none; border: none; color: var(--muted);
      font-size: 16px; line-height: 1; padding: 1px 4px; border-radius: 3px; cursor: pointer;
    }
    .q-item:hover .q-del { opacity: 1; }
    .q-del:hover { color: var(--red); }
    button { cursor: pointer; }
    button:disabled { opacity: .3; pointer-events: none; }
    .q-empty { padding: 14px 18px; color: var(--muted); font-style: italic; font-size: 12px; }

    /* ── Add form ── */
    .add-form {
      display: flex; align-items: center;
      padding: 12px 22px;
      flex-shrink: 0;
    }
    .add-form input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text); padding: 5px 0; font-size: 13px; outline: none;
      font-family: inherit; letter-spacing: -0.01em;
    }
    .add-form input:focus { border-bottom-color: var(--text); }
    .add-form input::placeholder { color: var(--muted); }
    .add-form button {
      background: none; border: none; padding: 5px 0 5px 12px;
      font-size: 20px; color: var(--muted); line-height: 1; transition: color .15s;
    }
    .add-form button:hover { color: var(--text); }

    /* ── Activity page ── */
    #log {
      flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px;
      font-family: var(--mono); font-size: 11px; line-height: 1.85;
      color: var(--text); background: #eeebe2;
    }
    #log::-webkit-scrollbar { width: 3px; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .ll { display: block; }
    .ll.hdr  { color: var(--text); font-weight: 700; margin-top: 8px; }
    .ll.sec  { color: var(--text); font-weight: 600; }
    .ll.ok   { color: var(--green); }
    .ll.warn { color: var(--amber); }
    .ll.err  { color: var(--red); }
    .ll.mb   { color: var(--muted); font-style: italic; }
    .ll.done { color: var(--green); font-weight: 700; }
    .log-empty { color: var(--muted); font-style: italic; font-size: 12px; font-family: inherit; }

    /* ── Library page ── */
    .lib-toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 22px 10px; flex-shrink: 0;
    }
    .lib-tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .lib-count {
      font-size: 26px; font-weight: 700; letter-spacing: -0.04em; color: var(--text);
      line-height: 1;
    }
    .lib-refresh {
      background: none; border: none; color: var(--muted); font-size: 14px;
      padding: 2px 4px; line-height: 1; transition: color .15s;
    }
    .lib-refresh:hover { color: var(--text); }

    #lib-list { flex: 1; overflow-y: auto; }
    #lib-list::-webkit-scrollbar { width: 0; }

    .alb {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 22px;
      cursor: pointer; transition: background .1s;
    }
    .alb:hover { background: rgba(0,0,0,0.018); }
    .alb.alb-open { background: rgba(0,0,0,0.025); }
    .alb-tracks {
      padding: 2px 22px 14px 90px;
      background: rgba(0,0,0,0.015);
    }
    .trk-item {
      display: flex; align-items: baseline; gap: 10px;
      padding: 3px 0; font-size: 11px;
    }
    .trk-num {
      color: var(--muted); font-variant-numeric: tabular-nums;
      min-width: 18px; text-align: right; font-size: 10px; flex-shrink: 0;
      font-family: var(--mono);
    }
    .trk-title { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trk-dur { color: var(--muted); font-size: 10px; flex-shrink: 0; font-variant-numeric: tabular-nums; font-family: var(--mono); }
    .alb-art {
      width: 52px; height: 52px; border-radius: 3px; flex-shrink: 0;
      background: var(--border); object-fit: cover;
    }
    .alb-art-ph {
      width: 52px; height: 52px; border-radius: 3px; flex-shrink: 0;
      background: var(--border);
    }
    .alb-info { flex: 1; min-width: 0; }
    .alb-artist {
      font-size: 9px; color: var(--muted); letter-spacing: 0.07em;
      text-transform: uppercase; margin-bottom: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .alb-name {
      font-size: 18px; font-weight: 700; letter-spacing: -0.03em; color: var(--text);
      line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .alb-count { font-size: 10px; color: var(--muted); flex-shrink: 0; }

    .sync-btn {
      background: none; border: none; padding: 4px 6px;
      font-size: 15px; line-height: 1; cursor: pointer; flex-shrink: 0;
      color: var(--green); opacity: 0.55; transition: opacity .15s, color .15s;
    }
    .sync-btn:hover { opacity: 1; }
    .sync-btn.sync-no { color: var(--muted); opacity: 0.4; }
    .sync-btn.sync-no:hover { opacity: 0.8; }
    .alb.alb-excluded .alb-art,
    .alb.alb-excluded .alb-art-ph { opacity: 0.3; transition: opacity .2s; }
    .alb.alb-excluded .alb-info { opacity: 0.38; transition: opacity .2s; }
    .alb.alb-excluded .alb-name { text-decoration: line-through; text-decoration-color: var(--muted); }
    .alb.alb-excluded .alb-count { opacity: 0.3; }

    .lib-batch { display: flex; gap: 4px; }
    .lib-batch-btn {
      background: none; border: 1px solid var(--border); border-radius: 3px;
      font-size: 9px; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--muted); padding: 3px 8px; cursor: pointer; font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .lib-batch-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Footer bar ── */
    footer {
      background: #0c0c0c; color: #fff;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      flex-shrink: 0; position: relative; z-index: 2;
    }
    #footer-status { flex: 1; font-size: 10px; color: #555; letter-spacing: 0.05em; }
    .footer-btns { display: flex; gap: 5px; }
    .footer-btn {
      background: #1a1a1a; color: #888; border: 1px solid #2a2a2a;
      border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
      padding: 5px 12px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      transition: background .15s, color .15s;
    }
    .footer-btn:hover { background: #2a2a2a; color: #fff; }
    .footer-btn.primary { color: #ddd; border-color: #444; }
    .footer-btn.primary:hover { background: #fff; color: #000; border-color: #fff; }
    .footer-btn.danger { color: #d04040; border-color: #3a1818; }
    .footer-btn.danger:hover { background: rgba(200,60,60,.12); color: #e05050; }
  </style>
</head>
<body>

<!-- score sits directly on cream body — multiply blend reads correctly here -->
<img class="bg-score" src="/static/score.jpg" alt="">

<div class="shell">
  <div class="card">

    <!-- Top bar -->
    <div class="topbar">
      <div class="logo">slsk-auto</div>
      <div id="device-label" class="device-label">checking…</div>
      <div class="hdr-spacer"></div>
      <div class="hdr-btns">
        <button class="hdr-btn primary" id="hdr-dl"   onclick="run('download')">↓ DL</button>
        <button class="hdr-btn"         id="hdr-copy" onclick="run('copy')">→ Copy</button>
        <button class="hdr-btn danger"  id="hdr-stop" onclick="doStop()" disabled>■ Stop</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="showTab('queue')" id="tab-queue">Queue</div>
      <div class="tab" onclick="showTab('act')" id="tab-act">
        Activity<span class="tab-dot" id="act-dot"></span>
      </div>
      <div class="tab" onclick="showTab('lib')" id="tab-lib">Library</div>
    </div>

    <!-- Queue -->
    <div class="page active" id="page-queue">
      <div class="active-hero" id="hero" onclick="toggleHeroExpand()">
        <div class="hero-header">
          <div class="hero-label">Now downloading</div>
        </div>
        <div class="hero-empty">Nothing downloading.</div>
      </div>
      <div id="queue-list"></div>
      <form class="add-form" onsubmit="addAlbum(event)">
        <input id="add-input" type="text" placeholder="Artist - Album" autocomplete="off">
        <button type="submit" title="Add">+</button>
      </form>
    </div>

    <!-- Activity -->
    <div class="page" id="page-act">
      <div id="log"><span class="log-empty">Run download or sync to see activity.</span></div>
    </div>

    <!-- Library -->
    <div class="page" id="page-lib">
      <div class="lib-toolbar">
        <span id="lib-source" class="lib-tag"></span>
        <div style="flex:1"></div>
        <div class="lib-batch">
          <button class="lib-batch-btn" onclick="syncBatch('')">All on</button>
          <button class="lib-batch-btn" onclick="syncBatch('no')">All off</button>
        </div>
        <span id="lib-count" class="lib-count"></span>
        <button class="lib-refresh" onclick="loadLibrary()">↻</button>
      </div>
      <div id="lib-list" onscroll="updateLibBlur()"></div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer>
  <div id="footer-status">idle</div>
  <div class="footer-btns">
    <button class="footer-btn primary" id="btn-dl"     onclick="run('download')">↓ Download</button>
    <button class="footer-btn"         id="btn-verify" onclick="run('verify')">✓ Verify</button>
    <button class="footer-btn"         id="btn-copy"   onclick="run('copy')">→ Copy</button>
    <button class="footer-btn danger"  id="btn-stop"   onclick="doStop()" disabled>■ Stop</button>
  </div>
</footer>

<script>
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let es = null;
  let heroExpanded = false;
  let lastInProgress = [];

  async function api(path, opts={}) {
    return fetch(path, { headers:{'Content-Type':'application/json'}, ...opts }).then(r=>r.json());
  }

  // ── Tabs ──────────────────────────────────────
  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'lib') loadLibrary();
    if (name === 'act') {
      document.getElementById('act-dot').classList.remove('visible');
      if (!es) loadRecentLog();
    }
  }

  // ── Status ────────────────────────────────────
  async function pollStatus() {
    const s = await api('/api/status');
    const lbl = document.getElementById('device-label');
    lbl.className = s.device_mounted ? 'device-label on' : 'device-label';
    lbl.textContent = s.device_mounted ? s.device_name : 'no device';
    setRunning(s.running, s.running_script);
    if (s.running) {
      loadQueue();
      if (!es) connectStream();
    }
  }

  function setRunning(on, script) {
    ['btn-dl','hdr-dl'].forEach(id => document.getElementById(id).disabled = on);
    ['btn-copy','hdr-copy'].forEach(id => document.getElementById(id).disabled = on);
    ['btn-verify'].forEach(id => document.getElementById(id).disabled = on);
    ['btn-stop','hdr-stop'].forEach(id => document.getElementById(id).disabled = !on);
    const labels = { download: 'downloading…', copy: 'copying…', verify: 'verifying…', sync: 'syncing…' };
    const status = document.getElementById('footer-status');
    status.textContent = on ? (labels[script] || 'running…') : 'idle';
    status.style.color = on ? '#666' : '#3a3a3a';
  }

  // ── Run / Stop ────────────────────────────────
  async function run(script) {
    const r = await api(`/api/${script}`, { method:'POST' });
    if (r.error) { alert(r.error); return; }
    setRunning(true, script);
    document.getElementById('log').innerHTML = '';
    connectStream();
  }

  async function doStop() { await api('/api/stop', { method:'POST' }); }

  function connectStream() {
    if (es) es.close();
    es = new EventSource('/stream');
    es.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.t === 'log') {
        appendLog(msg.text);
        if (!document.getElementById('page-act').classList.contains('active'))
          document.getElementById('act-dot').classList.add('visible');
      }
      if (msg.t === 'done') {
        setRunning(false, null);
        loadQueue();
        es.close(); es = null;
      }
    };
    es.onerror = () => { setRunning(false, null); es.close(); es = null; };
  }

  // ── Queue ─────────────────────────────────────
  async function loadQueue() {
    const data = await api('/api/watchlist');
    lastInProgress = data.in_progress || [];
    renderHero(lastInProgress);
    renderList(data);
  }

  function toggleHeroExpand() {
    if (!lastInProgress.length) return;
    heroExpanded = !heroExpanded;
    renderHero(lastInProgress);
  }

  function renderHero(inProgress) {
    const hero = document.getElementById('hero');
    if (inProgress.length > 0) {
      hero.classList.add('live');
      const canExpand = inProgress.length > 1;
      const chevron = canExpand
        ? `<span class="hero-chevron${heroExpanded ? ' open' : ''}">▾</span>` : '';
      let expanded = '';
      if (heroExpanded && canExpand) {
        expanded = `<div class="hero-expanded">${
          inProgress.map((it, i) =>
            `<div class="hero-exp-item${i===0?' primary':''}">${i===0?'→ ':''}${esc(it.entry)}</div>`
          ).join('')
        }</div>`;
      }
      hero.innerHTML = `
        <div class="hero-header">
          <div class="hero-label"><span class="hero-live-dot"></span>Now downloading</div>
          ${chevron}
        </div>
        <div class="hero-title" title="${esc(inProgress[0].entry)}">${esc(inProgress[0].entry)}</div>
        <div class="hero-subtitle">in progress · ${inProgress.length} item${inProgress.length>1?'s':''}</div>
        ${expanded}`;
    } else {
      heroExpanded = false;
      hero.classList.remove('live');
      hero.innerHTML = `
        <div class="hero-header">
          <div class="hero-label">Now downloading</div>
        </div>
        <div class="hero-empty">Nothing downloading.</div>`;
    }
  }

  function renderList(data) {
    const el = document.getElementById('queue-list');
    el.innerHTML = '';
    const groups = [
      { key:'not_started', label:'Pending',    cls:'muted',   meta:false },
      { key:'completed',   label:'Downloaded', cls:'success', meta:true  },
      { key:'failed',      label:'Failed',     cls:'failed',  meta:false },
    ];
    let any = false;
    for (const g of groups) {
      const items = data[g.key] || [];
      if (!items.length) continue;
      any = true;
      const sep = document.createElement('div');
      sep.className = 'group-sep';
      sep.innerHTML = `<span class="group-sep-line"></span>
        <span class="group-sep-label">${g.label} ${items.length}</span>
        <span class="group-sep-line"></span>`;
      el.appendChild(sep);
      items.forEach(item => el.appendChild(makeItem(item, g.cls, g.meta)));
    }
    if (!any) el.innerHTML = '<div class="q-empty">Nothing queued.</div>';
  }

  function makeItem(item, labelCls, showMeta) {
    const div = document.createElement('div');
    div.className = 'q-item';
    const reason = labelCls === 'failed' && item.fail_reason ? item.fail_reason : '';
    div.innerHTML = `
      <div class="q-info">
        <span class="q-label ${labelCls}" title="${esc(item.entry)}">${esc(item.entry)}</span>
        ${reason ? `<span class="q-reason">${esc(reason)}</span>` : ''}
      </div>
      ${showMeta && item.tracks > 0 ? `<span class="q-meta">${item.tracks} trk</span>` : ''}`;
    const btn = document.createElement('button');
    btn.className = 'q-del'; btn.textContent = '×'; btn.dataset.entry = item.entry;
    btn.addEventListener('click', function(){ deleteEntry(this.dataset.entry, div); });
    div.appendChild(btn);
    return div;
  }

  async function addAlbum(e) {
    e.preventDefault();
    const inp = document.getElementById('add-input');
    const entry = inp.value.trim();
    if (!entry) return;
    const r = await api('/api/watchlist', { method:'POST', body: JSON.stringify({entry}) });
    if (r.duplicate) {
      inp.style.borderBottomColor = 'var(--amber)';
      setTimeout(()=>inp.style.borderBottomColor='', 1200);
      return;
    }
    inp.value = '';
    loadQueue();
  }

  async function deleteEntry(entry, row) {
    row.style.opacity = '.3';
    await api('/api/watchlist/delete', { method:'POST', body: JSON.stringify({entry}) });
    loadQueue();
  }

  // ── Log from file ─────────────────────────────
  async function loadRecentLog() {
    if (es) return;
    const logs = await api('/api/logs');
    if (!logs || !logs.length) return;
    const text = await fetch(`/api/logs/${encodeURIComponent(logs[0].name)}`).then(r => r.text());
    if (!text.trim()) return;
    const log = document.getElementById('log');
    log.innerHTML = '';
    text.split('\n').forEach(line => {
      if (line && !line.startsWith('#')) appendLog(line);
    });
  }

  // ── Log ───────────────────────────────────────
  function classifyLine(t) {
    if (t.startsWith('---'))                          return 'hdr';
    if (t.startsWith('==>') && /[Dd]one/.test(t))    return 'done';
    if (t.startsWith('==>'))                          return 'sec';
    if (/\bOK\b|close enough|verified/.test(t))      return 'ok';
    if (/MISMATCH|WARNING|FAILED|failed/i.test(t))   return 'warn';
    if (/error/i.test(t))                             return 'err';
    if (/MusicBrainz:/.test(t))                       return 'mb';
    return '';
  }
  function appendLog(text) {
    const log = document.getElementById('log');
    const empty = log.querySelector('.log-empty');
    if (empty) empty.remove();
    const s = document.createElement('span');
    s.className = 'll ' + classifyLine(text);
    s.textContent = text;
    log.appendChild(s);
    log.scrollTop = log.scrollHeight;
  }

  // ── Library + vertical blur ────────────────────
  let expandedAlbumRow = null;

  function msToMmSs(ms) {
    const s = Math.round(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  async function openAlbum(row, album) {
    if (expandedAlbumRow === row) {
      const panel = row.nextElementSibling;
      if (panel && panel.classList.contains('alb-tracks')) panel.remove();
      row.classList.remove('alb-open');
      expandedAlbumRow = null;
      updateLibBlur();
      return;
    }
    if (expandedAlbumRow) {
      const prev = expandedAlbumRow.nextElementSibling;
      if (prev && prev.classList.contains('alb-tracks')) prev.remove();
      expandedAlbumRow.classList.remove('alb-open');
    }
    expandedAlbumRow = row;
    row.classList.add('alb-open');

    const data = await api(`/api/tracklist?folder=${encodeURIComponent(album.path)}`);
    if (data.error || !data.tracks) { expandedAlbumRow = null; row.classList.remove('alb-open'); return; }

    const panel = document.createElement('div');
    panel.className = 'alb-tracks';
    panel.innerHTML = data.tracks.length
      ? data.tracks.map(t => {
          const num = t.track ? String(parseInt(t.track)).padStart(2, '0') : '—';
          const dur = t.duration_ms ? msToMmSs(t.duration_ms) : '';
          return `<div class="trk-item">
            <span class="trk-num">${esc(num)}</span>
            <span class="trk-title">${esc(t.title)}</span>
            ${dur ? `<span class="trk-dur">${esc(dur)}</span>` : ''}
          </div>`;
        }).join('')
      : '<div class="trk-item"><span class="trk-title" style="color:var(--muted)">No audio files found</span></div>';
    row.after(panel);
    updateLibBlur();
  }

  let _libAlbums = [];

  function applySyncState(row, syncVal) {
    if (syncVal === 'no') {
      row.classList.add('alb-excluded');
      row._syncBtn.className = 'sync-btn sync-no';
      row._syncBtn.textContent = '○';
      row._syncBtn.title = 'Excluded from copy — click to include';
    } else {
      row.classList.remove('alb-excluded');
      row._syncBtn.className = 'sync-btn';
      row._syncBtn.textContent = '●';
      row._syncBtn.title = 'Included in copy — click to exclude';
    }
    row._syncVal = syncVal;
  }

  async function toggleSync(row, entry) {
    const next = row._syncVal === 'no' ? '' : 'no';
    applySyncState(row, next);
    updateLibBlur();
    await api('/api/watchlist/sync', {
      method: 'PATCH',
      body: JSON.stringify({ entry, sync: next })
    });
  }

  async function syncBatch(val) {
    const rows = document.querySelectorAll('#lib-list .alb');
    const patches = [];
    rows.forEach(row => {
      if (row._entry && row._syncVal !== val) {
        patches.push(row);
        applySyncState(row, val);
      }
    });
    updateLibBlur();
    await Promise.all(patches.map(row =>
      api('/api/watchlist/sync', {
        method: 'PATCH',
        body: JSON.stringify({ entry: row._entry, sync: val })
      })
    ));
  }

  async function loadLibrary() {
    const [{ albums, source }, wlData] = await Promise.all([
      api('/api/library'),
      api('/api/watchlist')
    ]);
    _libAlbums = albums;

    const syncMap = {};
    ['not_started','in_progress','completed','failed','verified'].forEach(bucket => {
      (wlData[bucket] || []).forEach(item => { syncMap[item.entry] = item.sync || ''; });
    });

    document.getElementById('lib-source').textContent = source === 'device' ? 'Device' : 'Staging';
    document.getElementById('lib-count').textContent = `${albums.length}`;
    const list = document.getElementById('lib-list');
    list.innerHTML = '';
    expandedAlbumRow = null;

    albums.forEach(a => {
      const row = document.createElement('div');
      row.className = 'alb';
      row._entry = a.name;
      row.addEventListener('click', () => openAlbum(row, a));

      const img = document.createElement('img');
      img.className = 'alb-art';
      img.src = `/api/artwork?folder=${encodeURIComponent(a.name)}&artist=${encodeURIComponent(a.artist||'')}&album=${encodeURIComponent(a.album)}`;
      img.onerror = function() {
        const ph = document.createElement('div'); ph.className = 'alb-art-ph';
        this.replaceWith(ph);
      };
      row.appendChild(img);

      const info = document.createElement('div'); info.className = 'alb-info';
      info.innerHTML = `<div class="alb-artist">${esc(a.artist||'—')}</div>
        <div class="alb-name">${esc(a.album)}</div>`;
      row.appendChild(info);

      const count = document.createElement('div'); count.className = 'alb-count';
      count.textContent = `${a.tracks} trk`;
      row.appendChild(count);

      const syncBtn = document.createElement('button');
      syncBtn.addEventListener('click', e => { e.stopPropagation(); toggleSync(row, a.name); });
      row._syncBtn = syncBtn;
      row.appendChild(syncBtn);

      applySyncState(row, syncMap[a.name] ?? '');
      list.appendChild(row);
    });
    updateLibBlur();
  }

  function updateLibBlur() {
    const list = document.getElementById('lib-list');
    const items = list.querySelectorAll('.alb');
    const listRect = list.getBoundingClientRect();
    // scroll fraction 0→1 moves focal point from list top to list center
    const maxScroll = list.scrollHeight - list.clientHeight;
    const frac = maxScroll > 0 ? Math.min(1, list.scrollTop / maxScroll) : 0;
    const focalY = listRect.top + frac * listRect.height;
    const sharpRadius = 55;
    items.forEach(el => {
      const itemRect = el.getBoundingClientRect();
      const itemCenter = itemRect.top + itemRect.height / 2;
      const dist = Math.max(0, Math.abs(itemCenter - focalY) - sharpRadius);
      const blurPx = Math.min(10, dist / 38);
      const opacity = Math.max(0.15, 1 - blurPx / 10);
      el.style.filter  = blurPx > 0.3 ? `blur(${blurPx.toFixed(1)}px)` : '';
      el.style.opacity = opacity < 0.98 ? opacity.toFixed(2) : '';
    });
  }

  // ── Init ──────────────────────────────────────
  pollStatus();
  loadQueue();
  loadRecentLog();
  setInterval(pollStatus, 5000);
</script>
</body>
</html>
